name: Pest Tests

# Tests run on SQLite :memory: (see phpunit.xml), so this workflow needs no
# database or Redis service and no per-worker database for --parallel.
on:
  pull_request:
    branches: ['dev', 'main']
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pest-tests:
    if: ${{ !github.event.pull_request.draft }}
    name: Pest Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare the application
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate

      - name: Build assets
        run: npm run build

      - name: Run tests
        run: vendor/bin/pest --parallel --enforce-time-limit --default-time-limit=60 --fail-on-risky --compact

      - name: Archive Laravel.log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-laravel-log
          path: storage/logs/laravel.log
