name: PHPStan

on:
  workflow_dispatch:
  pull_request:
    branches: ['dev', 'main']
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  phpstan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress
