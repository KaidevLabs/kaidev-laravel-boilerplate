name: Duster Lint

on:
  workflow_dispatch:
  pull_request:
    branches: ['dev', 'main']
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  duster-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The action installs PHP + Composer dependencies itself.
      - name: 'Duster Lint'
        uses: tighten/duster-action@v3
        with:
          args: lint
