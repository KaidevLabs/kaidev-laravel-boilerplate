name: Front Lint

on:
  workflow_dispatch:
  pull_request:
    branches: ['dev', 'main']
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  front-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --with-form --no-interaction

      # `check` is `vp check` (vite-plus): oxfmt formatting + oxlint linting.
      # `types:check` is svelte-check: `vp check` does not type-check .svelte files.
      - name: Check Frontend
        run: npm run check

      - name: Check Frontend Types
        run: npm run types:check
